version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pip
    directory: "/parts/003-numpy-mastery"
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(numpy)"
    labels:
      - dependencies
      - python
