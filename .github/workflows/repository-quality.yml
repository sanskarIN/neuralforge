name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD || git diff --check

      - name: Compile repository Python
        run: python -m compileall -q tools src tests parts

      - name: Validate repository invariants
        run: python tools/validate_repository.py

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run dependency-free unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

  numpy-part-003:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: parts/003-numpy-mastery/requirements.txt

      - name: Install Part 003 dependencies
        run: python -m pip install -r parts/003-numpy-mastery/requirements.txt

      - name: Run Part 003 NumPy tests
        run: python -m unittest discover -s parts/003-numpy-mastery -p "test_*.py" -v
