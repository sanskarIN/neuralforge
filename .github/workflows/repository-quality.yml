name: Repository Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whitespace errors
        run: git diff --check HEAD~1 HEAD || git diff --check

      - name: Compile repository tools
        run: python -m compileall -q tools

      - name: Validate repository invariants
        run: python tools/validate_repository.py
